# Continuous Integration for ChurnGuard.
# Runs on every pull request into main and every push to main.
# Each job is added by the task that introduces it (see docs/contributing.md).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs can only read the repository unless they ask for more.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Mypy
        run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Pytest with coverage
        run: uv run pytest --cov-report=html
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
