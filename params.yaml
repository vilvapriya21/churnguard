# Experiment parameters: the "knobs" that change model results.
# DVC watches this file, so changing a value here re-runs only the
# pipeline stages that depend on it (Task 5). Environment settings
# such as paths and log levels live in configs/ instead.

base:
  random_seed: 42
  target_column: Churn
  id_column: customerID

ingest:
  # Share of raw rows held back as "new customers to score later".
  scoring_size: 0.2

split:
  # Share of the training file held out to evaluate the model.
  test_size: 0.2

validate:
  max_missing_fraction: 0.05
  psi_bins: 10
  psi_warn: 0.1
  psi_fail: 0.25

train:
  # Probability above which a customer is flagged as "will churn".
  decision_threshold: 0.5
  models:
    logistic_regression:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
    random_forest:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 5
      class_weight: balanced
    gradient_boosting:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 3

register:
  # Quality bar: a model is promoted only if it meets both minimums
  # and beats the current champion.
  min_roc_auc: 0.80
  min_recall: 0.70
