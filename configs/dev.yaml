# Settings for the dev environment (your laptop).
# Values here can be overridden by environment variables, e.g.
#   CHURNGUARD_LOG_LEVEL=INFO
#   CHURNGUARD_MLFLOW__TRACKING_URI=http://localhost:5000
env: dev
log_level: DEBUG

dataset_url: https://www.kaggle.com/datasets/blastchar/telco-customer-churn

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_train: data/interim/train.csv
  interim_scoring: data/interim/scoring.csv
  processed_train: data/processed/train.csv
  processed_test: data/processed/test.csv
  model_file: models/model.joblib
  reports_dir: reports

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: churnguard-dev
  registered_model_name: churnguard
  champion_alias: champion
  challenger_alias: challenger
