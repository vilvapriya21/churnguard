# Settings for the staging environment (GitHub Actions CI).
# Data is pulled from the DVC remote before the pipeline runs.
env: staging
log_level: INFO

dataset_url: https://www.kaggle.com/datasets/blastchar/telco-customer-churn

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_train: data/interim/train.csv
  interim_scoring: data/interim/scoring.csv
  processed_train: data/processed/train.csv
  processed_test: data/processed/test.csv
  model_file: models/model.joblib
  data_quality_report: reports/data_quality.json
  train_summary: reports/train_summary.json
  metrics_report: reports/metrics.json
  figures_dir: reports/figures
  registration_report: reports/registration.json

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: churnguard-staging
  registered_model_name: churnguard
  champion_alias: champion
  challenger_alias: challenger
