# Settings for the staging environment (GitHub Actions CI).
# Data is pulled from the DVC remote before the pipeline runs.
env: staging
log_level: INFO

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: churnguard-staging
  registered_model_name: churnguard
  champion_alias: champion
  challenger_alias: challenger
